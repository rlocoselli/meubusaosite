<aside class="stop-sheet" id="stopSheet" data-city="{{ city_id }}" aria-hidden="true" aria-labelledby="stopSheetName" role="dialog" aria-modal="true" tabindex="-1"><button class="sheet-close" id="stopSheetClose" type="button" aria-label="{{ t('close') }}">×</button><div class="sheet-handle"></div><div class="sheet-head"><span class="sheet-stop-icon">⌖</span><div><small>{{ t('stops') }}</small><h2 id="stopSheetName">—</h2><p id="stopSheetCode"></p></div></div><p id="stopAccess"></p><div class="stop-actions"><button class="btn dark" type="button" id="saveStop">☆ {{ t('save_stop') }}</button><a class="btn" id="reportStop" href="/contacts.html#suggestions">{{ t('report') }}</a></div><label class="date-field">{{ t('service_date') }}<input type="date" id="stopDate" value="{{ local_date }}"></label><div id="stopSheetLoading" role="status">{{ t('loading') }}</div><div id="stopSheetContent" hidden><section><h3>{{ t('next_departures') }}</h3><div id="stopSheetDepartures" aria-live="polite"></div></section><section><h3>{{ t('lines') }}</h3><div class="sheet-routes" id="stopSheetRoutes"></div></section><div id="stopAlerts"></div><button class="btn lime" id="stopDirections" type="button">{{ t('open_directions') }} ↗</button></div></aside><div class="sheet-backdrop" id="sheetBackdrop"></div>
