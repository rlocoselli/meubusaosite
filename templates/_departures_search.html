<section class="stop-finder" id="departures" data-city="{{ city_id }}">
  <div class="stop-finder-heading"><div><p class="eyebrow dark"><span></span>{{ t('timetable') }}</p><h2>{{ t('next_departures') }}</h2><p>{{ t('stop_search_intro') }}</p></div><button id="findNearby" class="btn dark" type="button" data-city="{{ city_id }}">⌖ {{ t('use_location') }}</button></div>
  <p id="locationFeedback" class="location-feedback" role="status" aria-live="polite"></p>
  <section id="nearbyResults" class="nearby-stop-panel" hidden aria-labelledby="nearbyTitle"><div class="nearby-panel-heading"><h3 id="nearbyTitle">{{ t('nearby_stops') }}</h3><label>{{ t('search_radius') }}<select id="nearbyRadius"><option value="1000">1 km</option><option value="2000">2 km</option><option value="5000">5 km</option></select></label></div><p class="walking-note">{{ t('distance_hint') }}</p><div id="nearbyStopCards" class="nearby-stop-cards"></div></section>
  <form id="departuresForm" data-city="{{ city_id }}" data-stop-picker>
    <div class="stop-input-field"><label for="departureStopSearch">{{ t('stop_name') }}</label><div class="stop-input-wrap"><span aria-hidden="true">⌕</span><input id="departureStopSearch" type="search" name="stop_query" autocomplete="off" placeholder="{{ t('stop_search_placeholder') }}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="departureStopOptions" aria-describedby="stopPickerHint"><button type="button" id="clearDepartureStop" aria-label="{{ t('clear_search') }}" hidden>×</button></div><input type="hidden" name="stop" id="selectedDepartureStop"><p id="stopPickerHint">{{ t('choose_stop_hint') }}</p></div>
    <label class="departure-date">{{ t('service_date') }}<input name="date" id="departureDate" type="date" required value="{{ selected_date }}"></label><button class="btn lime" type="submit">{{ t('find_departures') }} →</button>
  </form>
  <div class="stop-picker-panel"><p id="stopSearchFeedback" class="stop-search-feedback" role="status" aria-live="polite"></p><div id="departureStopOptions" role="listbox" aria-label="{{ t('stops') }}"></div><button class="btn stop-more" id="moreDepartureStops" type="button" hidden>{{ t('show_more') }}</button></div>
  <section id="selectedStopPanel" class="selected-stop-panel" hidden aria-labelledby="selectedStopTitle"><div class="selected-stop-heading"><div><small>{{ t('selected_stop') }}</small><h3 id="selectedStopTitle"></h3><p id="selectedStopDetails"></p></div><a id="selectedStopTimetable" class="btn" href="#">{{ t('all_times') }} ↗</a></div><div id="departureResults" class="departure-results" aria-live="polite" aria-busy="false"></div><div class="departure-refresh"><p id="departureFreshness" class="muted"></p><button id="refreshDepartures" type="button" class="btn">↻ {{ t('refresh_departures') }}</button></div></section>
</section>
