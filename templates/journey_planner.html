<section class="journey-planner" id="journeyPlanner" data-city="{{ city_id }}"><div class="section-heading"><div><p class="eyebrow dark">↗ {{ t('nav_plan') }}</p><h2>{{ t('journey_title') }}</h2></div><p>{{ t('planning_note') }}</p></div><form id="journeyForm"><label>{{ t('from_label') }}<input name="from" list="originStops" autocomplete="off" required placeholder="{{ t('stop_search_hint') }}" data-stop-autocomplete><datalist id="originStops"></datalist></label><label>{{ t('to_label') }}<input name="to" list="destinationStops" autocomplete="off" required placeholder="{{ t('stop_search_hint') }}" data-stop-autocomplete><datalist id="destinationStops"></datalist></label><label>{{ t('service_date') }}<input type="date" name="date" value="{{ selected_date }}" required></label><label>{{ t('departure_time') }}<input type="time" name="time" required></label><label class="accessible-check"><input type="checkbox" name="accessible" value="1">{{ t('accessible_only') }}</label><button class="btn dark" type="submit">{{ t('journey_search') }} ↗</button></form><p class="walking-note">{{ t('walking_note') }}</p><div id="journeyResults" class="journey-results" aria-live="polite"></div>{% include 'travel_actions.html' %}</section>
